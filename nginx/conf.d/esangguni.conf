# eSANGGUNI Workshop — nginx vhost configuration
# Covers 4 subdomains:
#   esangguni.bayanaihan.net         → landing page (/)
#   ella.esangguni.bayanaihan.net    → E.L.L.A. (/ella)
#   obra.esangguni.bayanaihan.net    → O.B.R.A. (/obra)
#   yala.esangguni.bayanaihan.net    → Y.A.L.A. (/yala)
#
# All four domains proxy to the same esangguni-pilot container on port 3000.
# The Next.js app routes internally via the URL path.
#
# NOTE: This file is for the conf.d/ snippet included by nginx.conf.
#       SSL certificates must be issued via certbot before enabling HTTPS blocks.

# ── Shared proxy settings ─────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream esangguni_upstream {
    server esangguni:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirects ────────────────────────────────────────────────────
server {
    listen 80;
    server_name esangguni.bayanaihan.net
                ella.esangguni.bayanaihan.net
                obra.esangguni.bayanaihan.net
                yala.esangguni.bayanaihan.net;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── esangguni.bayanaihan.net  (landing page) ─────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name esangguni.bayanaihan.net;

    ssl_certificate     /etc/letsencrypt/live/esangguni.bayanaihan.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esangguni.bayanaihan.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Pass real IP to Next.js for participant logging
    real_ip_header X-Real-IP;

    location / {
        proxy_pass         http://esangguni_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # allow long SSE streams
        proxy_buffering    off;   # required for SSE
    }
}

# ── ella.esangguni.bayanaihan.net ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ella.esangguni.bayanaihan.net;

    ssl_certificate     /etc/letsencrypt/live/ella.esangguni.bayanaihan.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ella.esangguni.bayanaihan.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    real_ip_header X-Real-IP;

    # Rewrite bare root to /ella so the Next.js route resolves
    location = / {
        return 301 https://$host/ella;
    }

    location / {
        proxy_pass         http://esangguni_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }
}

