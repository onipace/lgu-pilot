<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="esangguni-logo-icon-title">
  <title id="esangguni-logo-icon-title">eSANGGUNI Icon</title>
  <defs>
    <linearGradient id="iconGradI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B69F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17A97D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#iconGradI)" opacity="0.12"/>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="none" stroke="url(#iconGradI)" stroke-width="2"/>

  <!-- Circuit traces -->
  <line x1="10" y1="32" x2="22" y2="32" stroke="#5B69F5" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="32" x2="54" y2="32" stroke="#17A97D" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="32" y2="20" stroke="#5B69F5" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="54" stroke="#17A97D" stroke-width="2" stroke-linecap="round"/>

  <!-- Circuit nodes -->
  <circle cx="10" cy="32" r="3.5" fill="#5B69F5"/>
  <circle cx="54" cy="32" r="3.5" fill="#17A97D"/>
  <circle cx="32" cy="10" r="3.5" fill="#5B69F5"/>
  <circle cx="32" cy="54" r="3.5" fill="#17A97D"/>

  <!-- Gavel -->
  <g transform="translate(32, 32)">
    <rect x="-14" y="-8" width="28" height="16" rx="4" fill="url(#iconGradI)" transform="rotate(-30)"/>
    <rect x="-3" y="3" width="6" height="18" rx="3" fill="#F5A623" transform="rotate(-30)"/>
    <ellipse cx="0" cy="18" rx="10" ry="4" fill="#5B69F5" opacity="0.5"/>
  </g>

  <!-- AI sparkles -->
  <circle cx="48" cy="14" r="2" fill="#F5A623"/>
  <circle cx="14" cy="48" r="2" fill="#F5A623"/>
  <circle cx="48" cy="48" r="1.5" fill="#F5A623" opacity="0.6"/>
</svg>
