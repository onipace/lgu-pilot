<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="legislative-process-title">
  <title id="legislative-process-title">Philippine Legislative Process: Bill to Ordinance</title>
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B69F5;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#17A97D;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F5A623;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes slideRight { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
      @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
      .flow-line { stroke-dasharray: 8 4; animation: slideRight 3s linear infinite; }
      .step-icon { animation: pulse 2s ease-in-out infinite; }
      .step-1 { animation-delay: 0s; }
      .step-2 { animation-delay: 0.4s; }
      .step-3 { animation-delay: 0.8s; }
      .step-4 { animation-delay: 1.2s; }
      .step-text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="#0A0F1E"/>

  <!-- Flow line -->
  <line x1="120" y1="140" x2="780" y2="140" stroke="url(#flowGrad)" stroke-width="3" class="flow-line" opacity="0.6"/>

  <!-- Step 1: Bill Drafting -->
  <g transform="translate(80, 100)">
    <circle cx="40" cy="40" r="36" fill="rgba(91,105,245,0.15)" stroke="#5B69F5" stroke-width="2" class="step-icon step-1"/>
    <!-- Document icon -->
    <rect x="28" y="22" width="24" height="32" rx="3" fill="none" stroke="#5B69F5" stroke-width="2"/>
    <line x1="34" y1="30" x2="46" y2="30" stroke="#5B69F5" stroke-width="1.5"/>
    <line x1="34" y1="36" x2="46" y2="36" stroke="#5B69F5" stroke-width="1.5"/>
    <line x1="34" y1="42" x2="42" y2="42" stroke="#5B69F5" stroke-width="1.5"/>
    <!-- Pen -->
    <line x1="48" y1="48" x2="56" y2="40" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="120" y="200" class="step-text" font-size="14" font-weight="700" fill="#5B69F5" text-anchor="middle">1. Bill Drafting</text>
  <text x="120" y="218" class="step-text" font-size="11" fill="#7A8DAA" text-anchor="middle">Sponsor prepares</text>
  <text x="120" y="232" class="step-text" font-size="11" fill="#7A8DAA" text-anchor="middle">proposed ordinance</text>

  <!-- Arrow 1→2 -->
  <g transform="translate(175, 130)">
    <polygon points="0,10 12,0 12,20" fill="#5B69F5" opacity="0.8"/>
  </g>

  <!-- Step 2: Committee Review -->
  <g transform="translate(270, 100)">
    <circle cx="40" cy="40" r="36" fill="rgba(23,169,125,0.15)" stroke="#17A97D" stroke-width="2" class="step-icon step-2"/>
    <!-- People icon -->
    <circle cx="32" cy="30" r="6" fill="none" stroke="#17A97D" stroke-width="2"/>
    <path d="M22 46c0-6 4-10 10-10s10 4 10 10" fill="none" stroke="#17A97D" stroke-width="2"/>
    <circle cx="48" cy="30" r="6" fill="none" stroke="#17A97D" stroke-width="2"/>
    <path d="M38 46c0-6 4-10 10-10s10 4 10 10" fill="none" stroke="#17A97D" stroke-width="2"/>
  </g>
  <text x="310" y="200" class="step-text" font-size="14" font-weight="700" fill="#17A97D" text-anchor="middle">2. Committee Review</text>
  <text x="310" y="218" class="step-text" font-size="11" fill="#7A8DAA" text-anchor="middle">Public hearing &amp;</text>
  <text x="310" y="232" class="step-text" font-size="11" fill="#7A8DAA" text-anchor="middle">stakeholder input</text>

  <!-- Arrow 2→3 -->
  <g transform="translate(365, 130)">
    <polygon points="0,10 12,0 12,20" fill="#17A97D" opacity="0.8"/>
  </g>

  <!-- Step 3: Sanggunian Deliberation -->
  <g transform="translate(460, 100)">
    <circle cx="40" cy="40" r="36" fill="rgba(245,166,35,0.15)" stroke="#F5A623" stroke-width="2" class="step-icon step-3"/>
    <!-- Gavel icon -->
    <rect x="26" y="28" width="28" height="12" rx="3" fill="none" stroke="#F5A623" stroke-width="2" transform="rotate(-20 40 34)"/>
    <rect x="38" y="36" width="4" height="16" rx="2" fill="none" stroke="#F5A623" stroke-width="2" transform="rotate(-20 40 44)"/>
    <ellipse cx="40" cy="52" rx="10" ry="4" fill="none" stroke="#F5A623" stroke-width="1.5"/>
  </g>
  <text x="500" y="200" class="step-text" font-size="14" font-weight="700" fill="#F5A623" text-anchor="middle">3. Deliberation</text>
  <text x="500" y="218" class="step-text" font-size="11" fill="#7A8DAA" text-anchor="middle">Sangguniang Bayan</text>
  <text x="500" y="232" class="step-text" font-size="11" fill="#7A8DAA" text-anchor="middle">debates &amp; votes</text>

  <!-- Arrow 3→4 -->
  <g transform="translate(555, 130)">
    <polygon points="0,10 12,0 12,20" fill="#F5A623" opacity="0.8"/>
  </g>

  <!-- Step 4: Ordinance Approved -->
  <g transform="translate(650, 100)">
    <circle cx="40" cy="40" r="36" fill="rgba(91,105,245,0.15)" stroke="#5B69F5" stroke-width="2" class="step-icon step-4"/>
    <!-- Checkmark + document -->
    <rect x="26" y="22" width="28" height="36" rx="3" fill="none" stroke="#5B69F5" stroke-width="2"/>
    <polyline points="34,40 40,46 50,32" fill="none" stroke="#17A97D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Seal -->
    <circle cx="46" cy="48" r="6" fill="rgba(245,166,35,0.3)" stroke="#F5A623" stroke-width="1.5"/>
  </g>
  <text x="690" y="200" class="step-text" font-size="14" font-weight="700" fill="#5B69F5" text-anchor="middle">4. Ordinance</text>
  <text x="690" y="218" class="step-text" font-size="11" fill="#7A8DAA" text-anchor="middle">Approved &amp; signed</text>
  <text x="690" y="232" class="step-text" font-size="11" fill="#7A8DAA" text-anchor="middle">into law</text>

  <!-- AI Enhancement badge -->
  <g transform="translate(350, 20)">
    <rect x="0" y="0" width="200" height="28" rx="14" fill="rgba(245,166,35,0.1)" stroke="rgba(245,166,35,0.3)" stroke-width="1"/>
    <text x="100" y="18" class="step-text" font-size="11" font-weight="700" fill="#F5A623" text-anchor="middle"> AI-Enhanced at Every Stage</text>
  </g>

  <!-- AI annotations -->
  <g transform="translate(100, 60)" opacity="0.7">
    <text class="step-text" font-size="9" fill="#5B69F5" text-anchor="middle">ELLA drafts</text>
    <text class="step-text" font-size="9" fill="#5B69F5" text-anchor="middle">compliance check</text>
  </g>
  <g transform="translate(290, 60)" opacity="0.7">
    <text class="step-text" font-size="9" fill="#17A97D" text-anchor="middle">OBRA validates</text>
    <text class="step-text" font-size="9" fill="#17A97D" text-anchor="middle">RA 7160 alignment</text>
  </g>
  <g transform="translate(480, 60)" opacity="0.7">
    <text class="step-text" font-size="9" fill="#F5A623" text-anchor="middle">ELLA provides</text>
    <text class="step-text" font-size="9" fill="#F5A623" text-anchor="middle">legal precedents</text>
  </g>
  <g transform="translate(670, 60)" opacity="0.7">
    <text class="step-text" font-size="9" fill="#5B69F5" text-anchor="middle">LINAW indexes</text>
    <text class="step-text" font-size="9" fill="#5B69F5" text-anchor="middle">for future reference</text>
  </g>

</svg>
